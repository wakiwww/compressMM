name: HauntedFilter
options:
  bundleIdPrefix: com.hauntedfilter
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16.0"

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""

targets:
  HauntedFilter:
    type: application
    platform: iOS
    sources:
      - HauntedFilter
    settings:
      base:
        INFOPLIST_FILE: HauntedFilter/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.waki.wreckit
        PRODUCT_NAME: "阴间录像"
        SWIFT_VERSION: "5.9"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: NO
    info:
      path: HauntedFilter/Info.plist
