name: HauntedFilter
options:
  bundleIdPrefix: com.hauntedfilter
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16.0"

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""

targets:
  HauntedFilter:
    type: application
    platform: iOS
    sources:
      - HauntedFilter
    settings:
      base:
        INFOPLIST_FILE: HauntedFilter/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.hauntedfilter.app
        PRODUCT_NAME: "阴间录像"
        SWIFT_VERSION: "5.9"
    info:
      path: HauntedFilter/Info.plist